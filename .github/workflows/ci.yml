name: Product verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verify_staging:
        description: 'Also verify the live dev.onlyempowerment.com candidate'
        type: boolean
        default: false
      staging_commit:
        description: 'Full Git SHA expected on live staging when deployed verification is enabled'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run format:check
      - run: npm audit
      - run: npm test
      - run: npm run build
        env:
          OE_RELEASE_BUILD: '1'
          OE_PRESENTATION: production
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify production-intended presentation
        run: npx playwright test tests/browser/presentation.spec.ts tests/browser/shell.spec.ts --output test-results/production
        env:
          OE_PRESENTATION: production
      - name: Build staging presentation
        run: npm run build
        env:
          OE_RELEASE_BUILD: '1'
          OE_PRESENTATION: staging
      - run: npm run test:e2e -- --output test-results/staging
      - name: Verify deployed staging
        if: github.event_name == 'workflow_dispatch' && inputs.verify_staging
        run: npx playwright test --config playwright.staging.config.ts
        env:
          OE_STAGING_COMMIT: ${{ inputs.staging_commit || github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: only-empowerment-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-review-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.verify_staging
        with:
          name: staging-review-${{ inputs.staging_commit || github.sha }}
          path: test-results-staging/
          retention-days: 7
