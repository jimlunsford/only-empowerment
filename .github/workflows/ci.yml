name: Product verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployed-staging-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: cc8bdb9225e5b479a60f23ac058a21585dcc5b4f
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify exact deployed candidate
        run: |
          test "$(git rev-parse HEAD)" = "cc8bdb9225e5b479a60f23ac058a21585dcc5b4f"
          test -z "$(git status --porcelain)"
          npx playwright test --config playwright.staging.config.ts
        env:
          OE_STAGING_COMMIT: cc8bdb9225e5b479a60f23ac058a21585dcc5b4f
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: staging-review-cc8bdb9225e5b479a60f23ac058a21585dcc5b4f
          path: test-results-staging/
          retention-days: 7
