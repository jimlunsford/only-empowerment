name: Accepted Rebuild Map main deployed acceptance
on:
  workflow_dispatch:
    inputs:
      verify_staging:
        description: 'Verify exact accepted main on dev.onlyempowerment.com'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  staging:
    if: inputs.verify_staging
    name: Exact 5e44590 deployed acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: 5e44590d26122dc368655c9554bdd0b08faac667
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Verify exact clean accepted-main source
        run: |
          test "$(git rev-parse HEAD)" = 5e44590d26122dc368655c9554bdd0b08faac667
          test -z "$(git status --porcelain)"
          git log -1 --format='%H %s'
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Complete deployed suite, all four browsers, zero retries
        run: npx playwright test --config playwright.staging.config.ts
        env:
          OE_STAGING_COMMIT: 5e44590d26122dc368655c9554bdd0b08faac667
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rebuild-main-staging-5e44590d26122dc368655c9554bdd0b08faac667
          path: test-results-staging/
          retention-days: 7
