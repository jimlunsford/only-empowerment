name: Reset accepted-main staging acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging:
    name: Exact 396a7ea deployed acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: 396a7ea49a41fcc61fb3a0ab0402acad74a9dff1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Verify exact clean accepted-main source
        run: |
          test "$(git rev-parse HEAD)" = 396a7ea49a41fcc61fb3a0ab0402acad74a9dff1
          test -z "$(git status --porcelain)"
          git log -1 --format='%H %s'
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Complete deployed suite, all four browsers, zero retries
        run: npx playwright test --config playwright.staging.config.ts
        env:
          OE_STAGING_COMMIT: 396a7ea49a41fcc61fb3a0ab0402acad74a9dff1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reset-staging-acceptance-396a7ea49a41fcc61fb3a0ab0402acad74a9dff1
          path: test-results-staging/
          retention-days: 7


