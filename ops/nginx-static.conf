# Include inside the site's existing HTTPS server block, replacing old locations.
# Keep its reviewed root, TLS, security headers and ACME configuration.
# Production must have no inherited X-Robots-Tag blocking indexing.
# Staging must retain: add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
server_tokens off;
autoindex off;
expires -1;

# Gzip works with standard Nginx, without requiring a third-party Brotli module.
gzip on;
gzip_vary on;
gzip_min_length 128;
gzip_types application/javascript text/javascript text/css image/svg+xml;

# Preserve the original 404 status, including direct requests for /404.html.
error_page 404 /404.html;
location = /404.html { internal; }
location = /404.css { try_files $uri =404; }
location = / { try_files /index.html =404; }
location = /index.html { try_files $uri =404; }
location = /build.json { try_files $uri =404; }
location = /favicon.svg { try_files $uri =404; }
location = /robots.txt { try_files $uri =404; }
location = /LICENSE.txt { try_files $uri =404; }
location = /COPYRIGHT.txt { try_files $uri =404; }
location = /THIRD_PARTY_NOTICES.txt { try_files $uri =404; }
location = /SHA256SUMS { try_files $uri =404; }
location ~ ^/assets/[A-Za-z0-9_-]+\.(js|css)$ {
    expires 1y;
    try_files $uri =404;
}
location ~ ^/fonts/[A-Za-z0-9_.-]+\.woff2$ { try_files $uri =404; }
location ~ ^/read/[a-z-]+\.(html|css|js)$ { try_files $uri =404; }
# Hash routes require no SPA catch-all. Unknown and private paths stay 404.
location / { return 404; }
